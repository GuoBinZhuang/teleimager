# =====================================================
# 本文件由 g1-mcap-capture 于 2026-10-21 修改（仅配置，未改代码）
# 原文件备份: cam_config_server.yaml.bak.20261021
# 回滚:  cp ~/teleimager/cam_config_server.yaml.bak.20261021 ~/teleimager/cam_config_server.yaml
#
# 修改原因:
#   1) 头部双目尚未安装，1-3.1 无设备。v1.5.0 的 ImageServer.start() 只要
#      任何一路相机解析失败(None)就整体退出，因此未装的相机必须两个
#      enable 都为 false（此时该路被完全跳过）。
#   2) 双腕相机此前被 disable，导致 55556/55557 不发布。
#   3) 两个腕部相机序列号相同(200901010001)，必须靠 physical_path 区分：
#        1-3.3 -> libuvc uid 1:6   (左腕, /dev/video8)
#        1-3.2 -> libuvc uid 1:5   (右腕, /dev/video6)
#      实测确认于 2026-10-21。
# =====================================================

# =====================================================
# Head camera configuration
# =====================================================
# camera topic
left_wrist_camera:
  # 2026-10-21: 开启 ZMQ，供 xr_teleoperate 与本工作区录制桥接同时订阅。
  enable_zmq: true
  zmq_port : 55556
  enable_webrtc: true
  webrtc_port : 60002
  webrtc_codec: h264
  type: uvc
  image_shape: [480, 640]
  binocular: false
  fps: 30
  # 实际节点为 /dev/video8；physical_path 优先级更高，二者应一致。
  video_id: 8
  physical_path:  /sys/devices/platform/bus@0/3610000.usb/usb1/1-3/1-3.3/1-3.3:1.0

# =====================================================
# Right wrist camera configuration
# =====================================================
right_wrist_camera:
  # 2026-10-21: 开启 ZMQ，供 xr_teleoperate 与本工作区录制桥接同时订阅。
  enable_zmq: true
  zmq_port : 55557
  enable_webrtc: true
  webrtc_port : 60003
  webrtc_codec: h264
  type: uvc
  image_shape: [480, 640]
  binocular: false
  fps: 30
  # 实际节点为 /dev/video6；physical_path 优先级更高，二者应一致。
  video_id: 6
  physical_path: /sys/devices/platform/bus@0/3610000.usb/usb1/1-3/1-3.2/1-3.2:1.0
head_camera:
  # camera config

  # if enable_zmq and enable_webrtc are both false, the camera will not start
  # Set to true to enable ZMQ publishing, false to disable
  # 2026-10-21: 头部双目未安装 -> 两路均关闭，跳过该相机。
  enable_zmq: true
  # Port to publish camera stream, e.g. zmq tcp://*:55555.  image_client.py should connect to the same port
  zmq_port : 55555
  # Set to true to enable WebRTC publishing, false to disable
  enable_webrtc: true
  # Port for WebRTC signaling server
  webrtc_port : 60001
  # webrtc codec preference, options: "vp8", "h264"
  webrtc_codec: h264

  # Type of camera:
  #   - "opencv"    → opencv driver
  #   - "realsense" → pyrealsense2 driver
  #   - "uvc"       → pyuvc driver
  type: uvc

  # Image Format
  # image resolution: [height, width]
  image_shape: [480, 1280]
  binocular: true
  # frame per second
  fps: 30
  physical_path: /sys/devices/platform/bus@0/3610000.usb/usb1/1-3/1-3.1/1-3.1:1.0

  # Camera identifiers (choose one or more):
  #   - video_id: X        → /dev/videoX  (e.g. 0 → /dev/video0)
  #   - serial_number: Y   → camera's hardware serial (e.g. 141722079879)
  #   - physical_path: Z   → sysfs physical USB path (e.g. /sys/devices/pci0000:00/.../1-11.2:1.0)
  #
  # Identifier priority:
  #   physical_path > serial_number > video_id
  #   if an identifier is not used, set it to null. The system will resolve the camera by priority.
  #
  # Notes:
  #   - type "realsense": supports serial_number only (but a RealSense can also be used as opencv/uvc if desired)
  #   - type "opencv":    supports video_id, serial_number, physical_path
  #   - type "uvc":       supports video_id, serial_number, physical_path
  # 2026-10-21: video_id 4 是 D435i 的 V4L2 节点，不是头部相机，已停用。
  # video_id: 4
  # serial_number: 01.00.00
  # serial_number: 420222073038
  # physical_path: /sys/devices/platform/bus@0/3610000.usb/usb1/1-3/1-3.1/1-3.1:1.0

  # ---------------- 头部双目装好后恢复用（取消注释并核对） ----------------
  # 1) 先跑:  ~/miniconda3/envs/teleimager/bin/teleimager-server --cf
  #    确认 1-3.1 上的设备类型与 physical_path / serial_number。
  # 2) 把上面 head_camera 的 enable_zmq / enable_webrtc 改回 true,
  #    再按下面参数覆盖(参考 2026-09-04 成功日志: 480x1280 @ 30 FPS):
  # enable_zmq: true
  # enable_webrtc: true
  # type: uvc
  # image_shape: [480, 1280]   # 左眼 | 右眼 并排单帧
  # binocular: true
  # physical_path: /sys/devices/platform/bus@0/3610000.usb/usb1/1-3/1-3.1/1-3.1:1.0
  # -------------------------------------------------------------------

